name: Planner

on:
 push:
   branches:
     - 'ask-**'
     - 'issue-**'

jobs:
  plan:
    runs-on: ubuntu-latest # 在最新的 Ubuntu runner 上运行
    container:
      image: ghcr.io/twwy/${{ github.event.repository.name }}/runtime-planner:latest

    permissions:
      contents: write      # 需要读取并写入仓库内容

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_REPO_TOKEN }}
        
      - name: Push thought branch
        run: |

          set -e
          EXEC_BRANCH="${{github.ref_name}}"
          ROOT_PATH=$(pwd)
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git config --global --add safe.directory ${ROOT_PATH}
          
          cat <<DELIMITER > /etc/gitops.yaml
          llm_model: qwen-max
          llm_api_url: https://dashscope.aliyuncs.com/compatible-mode/v1
          llm_api_key: ${{secrets.DASHSCOPE_API_KEY}}
          work_root_path: $(pwd)
          git_user_email: "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git_user_name: "${{ github.actor }}"
          preview_plan_markdown: $(pwd)/README.md
          DELIMITER
          
          python3 -m agitops.agent.planner
          
          if [ -f "task/doing-task" ]; then
            NEXT_TASK=$(cat task/doing-task)
            TARGET_BRANCH="${NEXT_TASK}/${EXEC_BRANCH}"
          else
            TARGET_BRANCH=${EXEC_BRANCH}
          fi

          echo "TARGET_BRANCH: ${TARGET_BRANCH}"          
          git push origin ${EXEC_BRANCH}:${TARGET_BRANCH}
      - uses: actions/github-script@v6
        id: create_comment
        with:
          github-token: ${{ secrets.GIT_REPO_TOKEN }}
          script: |
             const fs = require('fs');
             const path = require('path');
             const dirPath = 'event';

             if (!fs.existsSync(dirPath)) {
               console.log(`Directory not found: ${dirPath}. No comments will be created.`);
               return;
             }

             // 1. 从分支引用 (ref) 中提取 Issue 编号
             // context.ref 的格式通常是 'refs/heads/issue-123'
             const branchRef = context.ref;
             const match = branchRef.match(/^refs\/heads\/issue-(\d+)$/);
            
             // 2. 检查分支名是否匹配 'issue-**' 格式
             if (!match) {
               const branchName = branchRef.split('/').pop();
               console.log(`当前分支 '${branchName}' 不符合 'issue-**' 格式，脚本将跳过执行。`);
               return; // 退出脚本
             }

             // 3. 如果匹配成功，则提取 issueNumber
             const issueNumber = parseInt(match[1], 10);
             console.log(`从分支名中成功提取 Issue 编号: #${issueNumber}`);

             for (const entry of fs.readdirSync(dirPath)) {
               const fullPath = path.join(dirPath, entry);
               const stat = fs.statSync(fullPath);
               if (stat.isFile()) {
                 const fileContent = fs.readFileSync(fullPath, 'utf8');
                 await github.rest.issues.createComment({
                   issue_number: issueNumber,
                   owner: context.repo.owner,
                   repo: context.repo.repo,
                   body: fileContent
                 });
                 console.log(`Successfully created a comment for the file: ${entry}`);
               }
             }
             
