name: Docker Image CI

# 触发工作流程的事件
on:
 workflow_dispatch: # 只允许手动触发
   inputs: # （可选）如果你希望手动触发时能传入参数
     logLevel:
       description: 'Log level'
       required: false
       default: 'warning'
       type: choice
       options:
       - info
       - warning
       - debug
     tags:
       description: 'Test scenario tags'
       required: false
       type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest # 在最新的 Ubuntu runner 上运行

    permissions:
      contents: read      # 需要读取仓库内容
      packages: write     # 需要写入 GitHub Packages (GHCR)
      # id-token: write  # 如果使用 OIDC 登录到云提供商的容器仓库，则可能需要

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # 检出你的代码

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # 可选: 指定 buildx 版本
          # version: v0.10.0
          # 可选: 安装 buildkitd
          # install: true

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' # PR时不登录，避免浪费凭证
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' # PR时不登录
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }} # 或者 github.repository_owner
          password: ${{ secrets.GITHUB_TOKEN }} # GITHUB_TOKEN 自动由 GitHub Actions 提供

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/my-app # 推送到 Docker Hub 的镜像名
            ghcr.io/${{ github.repository_owner }}/my-app # 推送到 GHCR 的镜像名
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=,suffix=,format=short # git sha 作为标签
            type=raw,value=latest,enable={{is_default_branch}} # 如果是默认分支 (main), 则打上 latest 标签

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: . # Dockerfile 的上下文路径，通常是仓库根目录
          file: ./Dockerfile # Dockerfile 的路径
          push: ${{ github.event_name != 'pull_request' }} # 只有在非 PR 事件时才推送
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # platforms: linux/amd64,linux/arm64 # 可选: 构建多平台镜像
          # cache-from: type=gha # 可选: 启用 GitHub Actions 缓存
          # cache-to: type=gha,mode=max # 可选: 启用 GitHub Actions 缓存
