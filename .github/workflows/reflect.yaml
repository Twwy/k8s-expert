name: Reflect

on:
 push:
   branches:
     - 'issue-**'

jobs:
  plan:
    runs-on: ubuntu-latest # 在最新的 Ubuntu runner 上运行
    container:
      image: ghcr.io/twwy/${{ github.event.repository.name }}/runtime-explorer:latest

    permissions:
      contents: write      # 需要读取并写入仓库内容

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_REPO_TOKEN }}
          fetch-depth: 0

      - name: Reflect problem
        run: |

          set -e
          EXEC_BRANCH="${{github.ref_name}}"
          ROOT_PATH=$(pwd)
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git config --global user.name "{{ github.actor }}"
          git config --global --add safe.directory ${ROOT_PATH}
          
          cat <<DELIMITER > /etc/gitops.yaml
          llm_model: qwen-max
          llm_api_url: https://dashscope.aliyuncs.com/compatible-mode/v1
          llm_api_key: ${{secrets.DASHSCOPE_API_KEY}}
          workspace_path: $(pwd)/workspace
          task_path: $(pwd)/task
          DELIMITER
          
          python3 agent/explorer/explorer.agent.py reflect

          git add .
          git commit -m "reflect stack"

          # 遍历 todo-task 文件中的每一行任务名，推送到 explorer/$(taskName)/issue-xxx 分支
          TODO_TASK_FILE="$(pwd)/task/todo-task"
          if [ -f "$TODO_TASK_FILE" ]; then
            while IFS= read -r taskName; do
              [ -z "$taskName" ] && continue
              git push origin ${{github.ref_name}}:explorer/${taskName}/issue-${{ github.event.issue.number }}
            done < "$TODO_TASK_FILE"
          fi
          rm -rf $(pwd)/task/todo-task
