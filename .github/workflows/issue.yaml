name: Agent Task by Issue 

on:
 issues:
    types: [opened]

jobs:
  create_thought_branch:
    runs-on: ubuntu-latest # 在最新的 Ubuntu runner 上运行
    outputs:
      start_commit: ${{ steps.create_branch.outputs.start_commit }}
      
    permissions:
      contents: write      # 需要读取并写入仓库内容

    steps:
      - uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GIT_REPO_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '[任务创建中](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{github.run_id}})'
            })
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_REPO_TOKEN }}
        
      - id: create_branch
        name: Push thought branch
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          timestamp=$(date +'%Y%m%d%H%M%S')
          rm chat
          mkdir chat
          mkdir "chat/user_${timestamp}"
          echo -e "${{ github.event.issue.title }}\n${{ github.event.issue.body }}" > "chat/user_${timestamp}/message.md"
          git add chat
          git commit -m "thought question"
          git push origin ${{github.ref_name}}:issue-${{ github.event.issue.number }}
          echo "Create branch: [issue-${{ github.event.issue.number }}](${{ github.server_url }}/${{ github.repository }}/tree/issue-${{ github.event.issue.number }}) [Actions](${{ github.server_url }}/${{ github.repository }}/actions?query=branch%3Aissue-${{ github.event.issue.number }})" >> $GITHUB_STEP_SUMMARY
          echo "start_commit=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
      - uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GIT_REPO_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '已创建任务分支 [issue-${{ github.event.issue.number }}](${{ github.server_url }}/${{ github.repository }}/tree/ask-${{github.run_id}}) [Actions](${{ github.server_url }}/${{ github.repository }}/actions?query=branch%3Aissue-${{ github.event.issue.number }})'
            })